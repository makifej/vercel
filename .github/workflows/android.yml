name: Android build

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  check:
    name: Typecheck és tesztek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Függőségek
        working-directory: mobile
        run: npm ci
      - name: Natív Android projekt generálása (CNG)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Release APK fordítása
        working-directory: mobile/android
        env:
          # A játékszerver címe a repó változójából (Settings, Variables: GAME_API_URL).
          # Ha üres, az app helyi módban indul, és a cím a Beállításokban adható meg.
          EXPO_PUBLIC_API_URL: ${{ vars.GAME_API_URL }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Engedélyek ellenőrzése (nincs pontos riasztás, FR-21)
        working-directory: mobile/android
        run: |
          manifests=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*elease*')
          test -n "$manifests" || { echo "Nem található egyesített release manifest"; exit 1; }
          echo "$manifests"
          if grep -E 'SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|SYSTEM_ALERT_WINDOW' $manifests; then
            echo "Tiltott engedély az egyesített manifestben"
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      # Teszteléshez: a legfrissebb APK egy gördülő pre-release-ben, telefonról közvetlenül letölthető.
      # Forkból érkező PR-nél nem fut (ott nincs írási jog).
      - name: APK a pixeltojas-latest pre-release-be
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk pixeltojas.apk
          notes="Teszt-APK (debug kulccsal aláírva, nem áruházi kiadás). Commit: ${SHA}, build: $(date -u +%Y-%m-%dT%H:%MZ). Telepítés: a telefonon nyisd meg a pixeltojas.apk fájlt, és engedélyezd a telepítést ismeretlen forrásból."
          if gh release view pixeltojas-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload pixeltojas-latest pixeltojas.apk --clobber -R "$GITHUB_REPOSITORY"
            gh release edit pixeltojas-latest --notes "$notes" -R "$GITHUB_REPOSITORY"
          else
            gh release create pixeltojas-latest pixeltojas.apk --prerelease --target "$SHA" \
              --title "Pixeltojás: legfrissebb teszt-APK" --notes "$notes" -R "$GITHUB_REPOSITORY"
          fi
